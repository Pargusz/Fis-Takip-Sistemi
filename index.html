<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fatura ve Kasa Takip</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js"></script>
    
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .container {
            background-color: #fff;
            width: 100%;
            max-width: 800px;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            position: relative;
            border: 2px solid #5a4b81;
        }

        /* Form Alanı */
        .input-group {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .input-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 220px;
        }

        label {
            font-size: 15px;
            margin-bottom: 5px;
            color: #333;
            font-weight: 600;
        }

        /* Input stilleri (Checkbox hariç) */
        input:not([type="checkbox"]), select {
            background-color: #f0f0f0; 
            color: #333; 
            border: 1px solid #ccc;
            padding: 15px;
            border-radius: 30px;
            font-size: 16px;
            outline: none;
            text-align: center;
            width: 100%;
            box-sizing: border-box;
            transition: 0.3s;
            appearance: none;
        }

        select {
            background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%23333%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E");
            background-repeat: no-repeat;
            background-position: right 15px top 50%;
            background-size: 12px auto;
            cursor: pointer;
        }

        input:not([type="checkbox"]):focus, select:focus {
            background-color: #fff;
            border-color: #5a4b81;
            box-shadow: 0 0 5px rgba(90, 75, 129, 0.3);
        }

        .btn-submit {
            display: block;
            margin: 25px auto 40px auto;
            background-color: #5a4b81;
            color: white;
            padding: 15px 50px;
            border: none;
            border-radius: 30px;
            font-size: 18px;
            cursor: pointer;
            width: 100%;
            max-width: 300px;
            transition: transform 0.1s;
        }

        .btn-submit:active { transform: scale(0.98); }

        /* Liste Alanı */
        .bottom-section {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-top: 20px;
            flex-wrap: wrap;
            gap: 20px;
        }

        .list-area {
            flex: 1;
            min-width: 300px;
        }

        /* Liste Başlık Alanı (Title, Search, SelectAll) */
        .list-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 15px;
            border-bottom: 2px solid #f0f0f0;
            padding-bottom: 15px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .list-header h2 {
            margin: 0;
            font-size: 20px;
            color: #333;
            white-space: nowrap;
        }

        /* Yeni Arama Kutusu Stili */
        .search-date-input {
            padding: 5px 15px !important; /* !important ile genel input stilini eziyoruz */
            border-radius: 15px !important;
            border: 1px solid #ddd !important;
            font-size: 14px !important;
            width: auto !important;
            background-color: #fff !important;
            color: #555 !important;
        }

        .btn-select-all {
            background-color: #7f8c8d;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 13px;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .btn-select-all:hover {
            background-color: #5a4b81;
        }

        #fisListesi {
            list-style: none;
            padding: 0;
            max-height: 400px;
            overflow-y: auto;
        }

        .fis-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px;
            margin-bottom: 10px;
            border-bottom: 1px solid #e0e0e0;
            background-color: #fafafa;
            border-radius: 8px;
        }

        .fis-info {
            font-size: 16px;
            color: #2c3e50; 
            font-weight: 600; 
            margin-right: 10px;
            word-break: break-word;
            line-height: 1.5;
        }

        .badge-payment {
            font-size: 12px;
            background-color: #e0e0e0;
            padding: 2px 8px;
            border-radius: 10px;
            color: #555;
            margin-right: 5px;
            vertical-align: middle;
        }

        .actions {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        /* Checkbox Görünürlük Ayarı */
        .custom-checkbox {
            width: 25px;
            height: 25px;
            cursor: pointer;
            accent-color: #27ae60;
            appearance: auto !important; 
        }

        .btn-delete {
            background: none;
            border: none;
            color: #e74c3c;
            font-size: 20px;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-delete:hover { color: #c0392b; transform: scale(1.1); }

        .btn-excel {
            background-color: #27ae60;
            color: white;
            padding: 15px 30px;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            font-size: 16px;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .btn-excel:hover { background-color: #219150; }

        @media (max-width: 768px) {
            .container { padding: 20px; margin-top: 20px; }
            .input-group { flex-direction: column; align-items: center; }
            .input-wrapper { max-width: 100%; }
            .bottom-section { flex-direction: column; align-items: stretch; }
            .btn-excel { width: 100%; margin-top: 10px; justify-content: center; }
            .list-header { flex-direction: column; align-items: stretch; gap: 10px; }
            .header-left { justify-content: space-between; width: 100%; }
            .btn-select-all { justify-content: center; }
        }
    </style>
</head>
<body>

<div class="container">
    
    <div class="input-group">
        <div class="input-wrapper">
            <label>kurum adı</label>
            <input type="text" id="kurumAdi" placeholder="Örn: Market">
        </div>
        <div class="input-wrapper">
            <label>ödenen ücret</label>
            <input type="number" id="ucret" placeholder="TL">
        </div>
    </div>

    <div class="input-group">
        <div class="input-wrapper">
            <label>tarih</label>
            <input type="date" id="tarih">
        </div>
        
        <div class="input-wrapper">
            <label>ödeme yöntemi</label>
            <select id="odemeYontemi">
                <option value="TEB">TEB</option>
                <option value="Garanti">Garanti</option>
                <option value="Nakit Kasa">Nakit Kasa</option>
            </select>
        </div>
    </div>

    <button class="btn-submit" id="ekleBtn">Listeye Kaydet</button>

    <div class="bottom-section">
        <div class="list-area">
            
            <div class="list-header">
                <div class="header-left">
                    <h2>Tüm Fişler:</h2>
                    <input type="date" id="tarihFiltre" class="search-date-input" title="Tarihe Göre Ara">
                </div>
                
                <button class="btn-select-all" id="btnTumunuSec" onclick="tumunuSecIslemi()">
                    <i class="fa-solid fa-check-double"></i> Tümünü Seç
                </button>
            </div>

            <ul id="fisListesi">
                <li style="text-align:center; color:#999;">Veriler yükleniyor...</li>
            </ul>
        </div>
        <button class="btn-excel" onclick="excelIndir()">
            <i class="fa-solid fa-file-excel"></i> Seçilenleri Excel İndir
        </button>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, push, onValue, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyB7X6OVYJuJFqcvvFrGPD643IHcuYSHN9U",
        authDomain: "fistakip-c67ac.firebaseapp.com",
        databaseURL: "https://fistakip-c67ac-default-rtdb.europe-west1.firebasedatabase.app",
        projectId: "fistakip-c67ac",
        storageBucket: "fistakip-c67ac.firebasestorage.app",
        messagingSenderId: "493351472822",
        appId: "1:493351472822:web:91b18f178deea1d7b3a017",
        measurementId: "G-HSS9R1B3RT"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const dbRef = ref(db, 'fisler'); 

    // Global değişkenler (Filtreleme için veriyi hafızada tutacağız)
    let tumVeriler = {}; 

    const btnEkle = document.getElementById('ekleBtn');
    const tarihFiltre = document.getElementById('tarihFiltre');

    // 1. VERİ EKLEME
    btnEkle.addEventListener('click', () => {
        const kurum = document.getElementById('kurumAdi').value;
        const ucret = document.getElementById('ucret').value;
        const tarih = document.getElementById('tarih').value;
        const odeme = document.getElementById('odemeYontemi').value;

        if (kurum === "" || ucret === "" || tarih === "") {
            alert("Lütfen tüm alanları doldurun!");
            return;
        }

        push(dbRef, {
            kurum: kurum,
            ucret: parseFloat(ucret),
            tarih: tarih,
            odeme: odeme
        });

        document.getElementById('kurumAdi').value = "";
        document.getElementById('ucret').value = "";
        document.getElementById('tarih').value = "";
    });

    // 2. VERİ OKUMA (Realtime)
    onValue(dbRef, (snapshot) => {
        tumVeriler = snapshot.val() || {}; // Veriyi global değişkene kaydet
        listeyiRenderEt(); // Listeyi çiz
    });

    // 3. FİLTRELEME OLAYI
    tarihFiltre.addEventListener('change', listeyiRenderEt);

    // 4. LİSTEYİ EKRA ÇİZME FONKSİYONU (Filtreye göre)
    function listeyiRenderEt() {
        const listeElementi = document.getElementById('fisListesi');
        const secilenTarih = tarihFiltre.value; // Filtre kutusundaki tarih

        listeElementi.innerHTML = ""; 
        
        if (Object.keys(tumVeriler).length === 0) {
            listeElementi.innerHTML = "<li style='text-align:center; color:#999;'>Henüz fiş eklenmedi.</li>";
            return;
        }

        let veriBulundu = false;

        Object.keys(tumVeriler).forEach(key => {
            const fis = tumVeriler[key];

            // FİLTRELEME MANTIĞI:
            // Eğer tarih seçilmemişse HEPSİNİ göster
            // VEYA tarih seçilmişse ve fişin tarihi uyuyorsa göster
            if (!secilenTarih || fis.tarih === secilenTarih) {
                
                veriBulundu = true;
                const li = document.createElement('li');
                li.className = 'fis-item';

                let gosterilenTarih = fis.tarih.split('-').reverse().join('.');
                const odemeYontemi = fis.odeme ? fis.odeme : "TEB";

                li.innerHTML = `
                    <span class="fis-info">
                        ${gosterilenTarih} <span class="badge-payment">${odemeYontemi}</span> ${fis.kurum} <br>
                        <small style="color:#555">(${fis.ucret} TL)</small>
                    </span>
                    <div class="actions">
                        <input type="checkbox" class="custom-checkbox" 
                            data-kurum="${fis.kurum}" 
                            data-ucret="${fis.ucret}" 
                            data-tarih="${fis.tarih}"
                            data-odeme="${odemeYontemi}">
                        
                        <button class="btn-delete" data-key="${key}">
                            <i class="fa-solid fa-trash"></i>
                        </button>
                    </div>
                `;
                listeElementi.appendChild(li);
            }
        });

        if (!veriBulundu) {
            listeElementi.innerHTML = "<li style='text-align:center; color:#999;'>Bu tarihte kayıt bulunamadı.</li>";
        }

        // Silme butonlarına olay ekle
        document.querySelectorAll('.btn-delete').forEach(btn => {
            btn.addEventListener('click', function() {
                const key = this.getAttribute('data-key');
                if(confirm("Bu fişi silmek istediğine emin misin?")) {
                    const silinecekRef = ref(db, 'fisler/' + key);
                    remove(silinecekRef);
                }
            });
        });
    }

    // Fonksiyonları global scope'a taşı (HTML onclick çalışsın diye)
    window.listeyiRenderEt = listeyiRenderEt;
</script>

<script>
    // JS FONKSİYONLARI

    // Tümünü Seç / Kaldır
    function tumunuSecIslemi() {
        const checkboxlar = document.querySelectorAll('.custom-checkbox');
        if (checkboxlar.length === 0) return;

        const btn = document.getElementById('btnTumunuSec');
        const hepsiSeciliMi = Array.from(checkboxlar).every(cb => cb.checked);

        if (hepsiSeciliMi) {
            checkboxlar.forEach(cb => cb.checked = false);
            btn.innerHTML = '<i class="fa-solid fa-check-double"></i> Tümünü Seç';
        } else {
            checkboxlar.forEach(cb => cb.checked = true);
            btn.innerHTML = '<i class="fa-regular fa-square-check"></i> Seçimi Kaldır';
        }
    }

    // Excel İndir
    function excelIndir() {
        const seciliCheckboxlar = document.querySelectorAll('.custom-checkbox:checked');
        
        if (seciliCheckboxlar.length === 0) {
            alert("Lütfen indirmek için en az bir fiş seçin.");
            return;
        }

        let genelToplamTutar = 0;
        let tarihDetaylari = {}; 
        const satirVerileri = [];

        satirVerileri.push(["Tarih", "Ödeme Yöntemi", "Kurum Adı", "Tutar (TL)"]);

        seciliCheckboxlar.forEach(cb => {
            const kurum = cb.getAttribute('data-kurum');
            const ucret = parseFloat(cb.getAttribute('data-ucret'));
            const tarih = cb.getAttribute('data-tarih');
            const odeme = cb.getAttribute('data-odeme');

            genelToplamTutar += ucret;

            if (!tarihDetaylari[tarih]) {
                tarihDetaylari[tarih] = { adet: 0, gunlukToplam: 0 };
            }
            tarihDetaylari[tarih].adet += 1;
            tarihDetaylari[tarih].gunlukToplam += ucret;

            const duzgunTarih = tarih.split('-').reverse().join('.');
            satirVerileri.push([duzgunTarih, odeme, kurum, ucret]);
        });

        const excelTablosu = [];
        excelTablosu.push(["GENEL TOPLAM:", genelToplamTutar + " TL"]);
        excelTablosu.push([]); 

        satirVerileri.forEach(satir => excelTablosu.push(satir));
        
        excelTablosu.push([]); 
        excelTablosu.push(["", "", "TOPLAM:", genelToplamTutar + " TL"]);
        excelTablosu.push([]); 
        excelTablosu.push([]); 

        excelTablosu.push(["GÜNLÜK İŞLEM RAPORU"]);
        excelTablosu.push(["Tarih", "İşlem Sayısı", "Günlük Toplam"]);

        Object.keys(tarihDetaylari).sort().forEach(tarihKey => {
            const veri = tarihDetaylari[tarihKey];
            const duzgunTarih = tarihKey.split('-').reverse().join('.');
            
            excelTablosu.push([
                duzgunTarih, 
                veri.adet + " adet işlem", 
                veri.gunlukToplam + " TL"
            ]);
        });

        const worksheet = XLSX.utils.aoa_to_sheet(excelTablosu);
        worksheet['!cols'] = [{ wch: 15 }, { wch: 15 }, { wch: 30 }, { wch: 15 }];

        const workbook = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(workbook, worksheet, "Kasa Takip");
        XLSX.writeFile(workbook, "Harcama_Raporu.xlsx");
    }
</script>

</body>
</html>
